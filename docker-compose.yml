services:
  postgres:
    image: postgres:16
    container_name: shrnk-postgres
    environment:
      POSTGRES_DB: shrnk
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:


